# Which environment each example needs, and what it should produce.
#
# The examples exercise frameworks whose pins are mutually exclusive, so they
# cannot share one environment:
#
#   - vllm 0.9.1 requires torch==2.7.0 exactly.
#   - transformers newer than 4.51.3 builds a DynamicCache in GPT-2's forward
#     that torch 2.7's dynamo cannot trace, so the HF examples are pinned to
#     both together.
#   - tensorflow brings its own CUDA stack.
#
# Everything not held back by one of those runs on torch 2.8.
#
# eprof is built once per environment and cannot be shared between them: the
# extension links the libtorch that will import it. `scripts/ae.py` does that
# build; nothing here is installed by hand.
#
# `produces` is what the example writes. The runner requires every one of them
# to appear, to parse, and -- for a chrome trace -- to carry events. Paths are
# relative to `dir`.

[env.base]
description = "PyTorch only. The largest group, and the one that needs nothing special."
python = "3.10"
requires = ["torch==2.8.0", "numpy", "einops"]

[env.hf]
description = "Hugging Face transformers. Held at torch 2.7 by the dynamo/DynamicCache incompatibility above."
python = "3.10"
requires = ["torch==2.7.0", "transformers==4.51.3", "numpy", "accelerate"]

[env.vllm]
description = "vLLM, which pins torch==2.7.0 itself."
python = "3.10"
# transformers is pinned alongside: vllm 0.9.1 registers model configurations of
# its own, and transformers 4.54+ already defines some of them ("'aimv2' is
# already used by a Transformers config"), which fails at import.
requires = [
    "vllm==0.9.1",
    "transformers==4.51.3",
    # vllm-9471 is about the FlashInfer attention backend, and sets
    # VLLM_ATTENTION_BACKEND=FLASHINFER, so the backend has to be there.
    "flashinfer-python",
]

[env.megatron]
description = "Megatron-LM core. On torch 2.7: 2.8's dynamo refuses to inline the contextlib manager Megatron's forward uses."
python = "3.10"
requires = ["torch==2.7.0", "megatron-core==0.12.0", "numpy"]

[env.tf]
description = "TensorFlow. Still needs torch, because the example profiles TF work through eprof."
python = "3.10"
requires = ["torch==2.8.0", "tensorflow==2.20.0", "numpy"]

[env.jax]
description = "JAX. Needs torch as well: the eprof extension links libtorch, so anything that loads it loads torch too."
python = "3.10"
requires = ["torch==2.8.0", "jax[cuda12]==0.5.0", "numpy", "flax", "transformers==4.51.3"]

[env.diffusers]
description = "Hugging Face diffusers, from the commit the artifact was written against."
python = "3.10"
requires = [
    "torch==2.8.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@0454fbb",
    "transformers==4.51.3",
    "numpy",
    "accelerate",
]

# --- The examples ------------------------------------------------------------
# `dir` is relative to examples/. `script` runs with that as its cwd, which is
# where its output lands.

[[example]]
name = "pytorch-141210"
env = "base"
dir = "artifacts/pytorch-141210"
script = "main.py"
produces = ["trace_fused.json", "trace_separate.json"]
about = "A fused addmm against a separate matmul plus add."

[[example]]
name = "pytorch-141210-up-proj"
env = "base"
dir = "artifacts/pytorch-141210"
script = "main_up_proj.py"
produces = ["trace_up_proj_fused.json", "trace_up_proj_separate.json"]
about = "The same comparison at an MLP up-projection's shape."

[[example]]
