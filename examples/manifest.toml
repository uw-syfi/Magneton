# --- Post-processing ---------------------------------------------------------
# These read what an example above wrote, so they declare what they need.

[[example]]
name = "pytorch-181115-plot"
env = "base"
dir = "artifacts/pytorch-181115"
script = "plot.py"
needs = ["pytorch-181115"]
requires = ["matplotlib"]
produces = ["normal.png", "uneven.png"]
about = "Plots the power series of the two runs against each other."

[[example]]
name = "pytorch-181115-study"
env = "hf"
dir = "artifacts/pytorch-181115"
script = "make_study_gpt.py"
needs = ["pytorch-181115-gpt"]
requires = ["pandas", "numpy"]
produces = ["study_gpt.csv"]
about = "Resamples the GPT-2 power series onto a common grid."

[[example]]
name = "pytorch-181115-plot-gpt"
env = "hf"
dir = "artifacts/pytorch-181115"
script = "plot_gpt.py"
args = ["-i", "study_gpt.csv", "-o", "study_gpt.png"]
needs = ["pytorch-181115-study"]
requires = ["matplotlib", "pandas"]
produces = ["study_gpt.png"]
about = "Plots that series."
