# How to run this repository's tests.
#
# Not in either distribution's pyproject.toml: the tests span both packages and
# the extension module underneath them, so they belong to the repository rather
# than to anything it ships. Config that spans the repo lives at the repo root,
# where every tool looks for it.
[pytest]
testpaths = tests/python
# So a working copy is importable without being installed. libeprof is not
# here: it is an extension module and has to be installed to exist at all.
pythonpath = python
